# This repo is a single package. Saying so stops pnpm from globbing the whole
# tree for workspace projects before every `pnpm run`, which otherwise crawls
# the mounted Workspace/ research share (virtualenvs and all) and stalls.
packages:
  - "."

# esbuild (used by Vitest) needs its postinstall to set up its native binary.
allowBuilds:
  esbuild: true
